# clipper.iceposeidon.network.conf
# Full HTTPS config — deploy.sh copies this into place after certbot issues
# the certificate (see deploy.sh step 9). Edit the placeholder IP below
# before first use.

# ── Rate limiting zones ──────────────────────────────────────────────────
# Belt-and-suspenders alongside the app's own in-process rate limiters:
# this stops abusive traffic at the edge, before it even reaches Node.
limit_req_zone $binary_remote_addr zone=clipper_general:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=clipper_admin:10m rate=2r/s;

server {
    listen 80;
    listen [::]:80;
    server_name clipper.iceposeidon.network;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name clipper.iceposeidon.network;

    ssl_certificate     /etc/letsencrypt/live/clipper.iceposeidon.network/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/clipper.iceposeidon.network/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparam.pem;

    # HSTS — the app's own headers (see clipper.js) cover CSP/frame-options/
    # nosniff; this is the one header that only makes sense set at the TLS
    # edge, so it lives here instead.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    client_max_body_size 60m;  # a little above ADMIN_UPDATE_MAX_MB (default 50MB)

    # ── Admin panel: restrict by IP in addition to the app's own password ──
    # Replace 203.0.113.10 with your real IP(s) (a VPN/office egress IP is
    # ideal — a home IP that changes will lock you out on the next rotation).
    # Anyone not in this list gets a plain 404 rather than a 403, so the
    # panel's existence isn't even confirmable from outside the allowlist.
    location ~ ^/(admin|api/admin) {
        allow 203.0.113.10;   # ← replace with your real IP
        # allow 203.0.113.11; # add more trusted IPs/ranges as needed
        deny all;
        error_page 403 =404 /404.html;

        limit_req zone=clipper_admin burst=5 nodelay;

        proxy_pass http://127.0.0.1:4242;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;   # the canary boot test can take a few seconds
    }

    location / {
        limit_req zone=clipper_general burst=40 nodelay;

        proxy_pass http://127.0.0.1:4242;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
